<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title data-i18n="wTitle">Bookmark Profiles — getting started</title>
  <style>
    body {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 20px 60px;
      font: 15px/1.65 -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
      color: #1f2430;
    }
    h1 { font-size: 26px; margin: 0 0 6px; }
    .sub { color: #6b7280; margin: 0 0 28px; }
    h2 { font-size: 17px; margin: 32px 0 8px; }
    .step {
      display: inline-block; width: 22px; height: 22px; border-radius: 50%;
      background: #1d4ed8; color: #fff; text-align: center; line-height: 22px;
      font-size: 13px; margin-right: 6px; user-select: none;
    }
    .important {
      background: #fff7e6;
      border: 1px solid #f0c36d;
      border-radius: 10px;
      padding: 12px 16px;
      margin: 10px 0;
    }
    code {
      background: #eef1f6;
      border-radius: 5px;
      padding: 1px 6px;
      font-size: 13px;
    }
    ol, ul { padding-left: 22px; }
    li { margin: 4px 0; }
    .muted { color: #6b7280; font-size: 13px; }
  </style>
</head>
<body>
  <h1 data-i18n="wH1">Bookmark Profiles</h1>
  <p class="sub" data-i18n="wSub"></p>

  <h2><span class="step">1</span><span data-i18n="wStep1H"></span></h2>
  <div class="important" data-i18n="wImportant"></div>
  <p>
    <span data-i18n="wHowOffA"></span><code>chrome://settings</code><span data-i18n="wHowOffB"></span>
  </p>
  <p class="muted" data-i18n="wStep1Note"></p>

  <h2><span class="step">2</span><span data-i18n="wStep2H"></span></h2>
  <ul>
    <li data-i18n="wStep2Li1"></li>
    <li data-i18n="wStep2Li2"></li>
    <li data-i18n="wStep2Li3"></li>
  </ul>
  <p class="muted" data-i18n="wStep2Note"></p>

  <h2><span class="step">3</span><span data-i18n="wStep3H"></span></h2>
  <ul>
    <li data-i18n="wStep3Li1"></li>
    <li data-i18n="wStep3Li2"></li>
    <li data-i18n="wStep3Li3"></li>
  </ul>

  <h2 data-i18n="wInstallH"></h2>
  <p>
    <span data-i18n="wInstallA"></span><code>chrome://extensions</code><span data-i18n="wInstallB"></span>
  </p>

  <h2 data-i18n="wInternalH"></h2>
  <ul>
    <li data-i18n="wIntLi1"></li>
    <li data-i18n="wIntLi2"></li>
    <li data-i18n="wIntLi3"></li>
    <li data-i18n="wIntLi4"></li>
  </ul>

  <script type="module">
    import { applyI18n } from './lib/i18n-dom.js';
    applyI18n();
  </script>
</body>
</html>
