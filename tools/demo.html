<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Демо попапа BarSwap</title>
  <!--
    Демо-страница попапа для скриншотов листинга Chrome Web Store.
    Параметры: ?state=normal|diff|empty и ?lang=en|ru.
    Словарь i18n берётся из настоящих _locales/<lang>/messages.json,
    затем динамически подключается popup.js — как в реальном расширении.
  -->
  <link rel="stylesheet" href="../popup/popup.css">
  <style>
    html, body { margin: 0; }
    body {
      width: 1280px;
      height: 800px;
      background: linear-gradient(160deg, #eef2ff 0%, #dbeafe 45%, #e0f2fe 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font: 13px/1.45 -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    }
    .stage { transform: scale(1.75); transform-origin: center; }
    .popup-box {
      width: 340px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 30px 70px rgba(30, 41, 59, 0.28), 0 2px 8px rgba(30, 41, 59, 0.12);
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="popup-box">
      <header>
        <h1 data-i18n="popupH1">Bookmark Profiles</h1>
      </header>

      <div id="status" class="status"></div>

      <ul id="list" class="list"></ul>

      <div class="create">
        <input id="newName" type="text" data-i18n-placeholder="newNamePlaceholder" maxlength="60">
        <button id="createBtn" class="primary" data-i18n="createBtn" data-i18n-title="createBtnTitle">Create</button>
      </div>

      <div id="flash" class="flash"></div>

      <footer>
        <a href="#" id="help" data-i18n="helpLink">How it works</a>
        <span class="sep">·</span>
        <a href="#" id="exportBtn" data-i18n="exportLink">Export</a>
        <span class="sep">·</span>
        <a href="#" id="importBtn" data-i18n="importLink">Import</a>
        <input id="importFile" type="file" accept=".json,application/json" hidden>
        <div id="usage" class="usage"></div>
      </footer>
    </div>
  </div>

  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const mode = params.get('state') || 'normal';
      const lang = params.get('lang') === 'ru' ? 'ru' : 'en';

      const dict = await (await fetch(`../_locales/${lang}/messages.json`)).json();
      function getMessage(key, subs = []) {
        const entry = dict[key];
        if (!entry) return key;
        let text = entry.message;
        if (entry.placeholders) {
          for (const [name, ph] of Object.entries(entry.placeholders)) {
            const idx = Number(String(ph.content).replace(/\$/g, '')) - 1;
            text = text.split(`$${name}$`).join(subs[idx] !== undefined ? String(subs[idx]) : '');
          }
        }
        return text;
      }

      const isRu = lang === 'ru';
      const names = isRu
        ? { home: 'Дом', work: 'Работа', project: 'Ремонт кухни' }
        : { home: 'Home', work: 'Work', project: 'Kitchen remodel' };
      const day = 86400000;
      const states = {
        normal: {
          profiles: [
            { id: 'pw', name: names.home, count: 14, updated: Date.now() - 2 * day },
            { id: 'ph', name: names.work, count: 21, updated: Date.now() - 5 * 3600000 },
            { id: 'pp', name: names.project, count: 6, updated: Date.now() - 9 * day },
          ],
          activeId: 'ph',
          barDiffers: false,
          barCount: 21,
          used: 12 * 1024,
          quota: 102400,
        },
        diff: {
          profiles: [
            { id: 'pw', name: names.home, count: 14, updated: Date.now() - 2 * day },
            { id: 'ph', name: names.work, count: 19, updated: Date.now() - 5 * 3600000 },
          ],
          activeId: 'ph',
          barDiffers: true,
          barCount: 21,
          used: 12 * 1024,
          quota: 102400,
        },
        empty: {
          profiles: [],
          activeId: null,
          barDiffers: null,
          barCount: 3,
          used: 0,
          quota: 102400,
        },
      };

      window.chrome = {
        i18n: { getMessage, getUILanguage: () => lang },
        runtime: {
          getURL: (p) => p,
          sendMessage: async (m) => {
            if (m.type === 'getState') return { ok: true, result: states[mode] };
            return { ok: true, result: { message: getMessage('msgSavedBar') } };
          },
        },
        tabs: { create: () => {} },
        storage: { onChanged: { addListener: () => {} } },
      };

      const s = document.createElement('script');
      s.type = 'module';
      s.src = '../popup/popup.js';
      document.head.appendChild(s);
    })();
  </script>
</body>
</html>
