<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title data-i18n="popupH1">Bookmark Profiles</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1 data-i18n="popupH1">Bookmark Profiles</h1>
  </header>

  <div id="status" class="status"></div>

  <ul id="list" class="list"></ul>

  <div class="create">
    <input id="newName" type="text" data-i18n-placeholder="newNamePlaceholder" maxlength="60">
    <button id="createBtn" class="primary" data-i18n="createBtn" data-i18n-title="createBtnTitle">Create</button>
  </div>

  <div id="flash" class="flash"></div>

  <footer>
    <a href="#" id="help" data-i18n="helpLink">How it works</a>
    <span class="sep">·</span>
    <a href="#" id="exportBtn" data-i18n="exportLink">Export</a>
    <span class="sep">·</span>
    <a href="#" id="importBtn" data-i18n="importLink">Import</a>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
    <div id="usage" class="usage"></div>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
