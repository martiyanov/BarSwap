<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Демо попапа «Профили закладок»</title>
  <!--
    Демо-страница попапа для скриншотов листинга Chrome Web Store.
    Мок chrome.* определяется ДО подключения popup.js (модули исполняются позже
    обычных скриптов). Состояние выбирается через ?state=normal|diff|empty.
  -->
  <link rel="stylesheet" href="../popup/popup.css">
  <style>
    html, body { margin: 0; }
    body {
      width: 1280px;
      height: 800px;
      background: linear-gradient(160deg, #eef2ff 0%, #dbeafe 45%, #e0f2fe 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font: 13px/1.45 -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    }
    .stage { transform: scale(1.75); transform-origin: center; }
    .popup-box {
      width: 340px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 30px 70px rgba(30, 41, 59, 0.28), 0 2px 8px rgba(30, 41, 59, 0.12);
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="popup-box">
      <header>
        <h1>Профили закладок</h1>
      </header>

      <div id="status" class="status"></div>

      <ul id="list" class="list"></ul>

      <div class="create">
        <input id="newName" type="text" placeholder="Название, например «Работа»" maxlength="60">
        <button id="createBtn" class="primary" title="Сохранить текущую панель закладок как профиль">Создать</button>
      </div>

      <div id="flash" class="flash"></div>

      <footer>
        <a href="#" id="help">Как это работает</a>
        <span class="sep">·</span>
        <a href="#" id="exportBtn">Экспорт</a>
        <span class="sep">·</span>
        <a href="#" id="importBtn">Импорт</a>
        <input id="importFile" type="file" accept=".json,application/json" hidden>
        <div id="usage" class="usage"></div>
      </footer>
    </div>
  </div>

  <script>
    const mode = new URLSearchParams(location.search).get('state') || 'normal';
    const day = 86400000;
    const states = {
      normal: {
        profiles: [
          { id: 'pw', name: 'Дом', count: 14, updated: Date.now() - 2 * day },
          { id: 'ph', name: 'Работа', count: 21, updated: Date.now() - 5 * 3600000 },
          { id: 'pp', name: 'Ремонт кухни', count: 6, updated: Date.now() - 9 * day },
        ],
        activeId: 'ph',
        barDiffers: false,
        barCount: 21,
        used: 12 * 1024,
        quota: 102400,
      },
      diff: {
        profiles: [
          { id: 'pw', name: 'Дом', count: 14, updated: Date.now() - 2 * day },
          { id: 'ph', name: 'Работа', count: 19, updated: Date.now() - 5 * 3600000 },
        ],
        activeId: 'ph',
        barDiffers: true,
        barCount: 21,
        used: 12 * 1024,
        quota: 102400,
      },
      empty: {
        profiles: [],
        activeId: null,
        barDiffers: null,
        barCount: 3,
        used: 0,
        quota: 102400,
      },
    };

    window.chrome = {
      runtime: {
        getURL: (p) => p,
        sendMessage: async (msg) => {
          if (msg.type === 'getState') return { ok: true, result: states[mode] };
          return { ok: true, result: { message: 'Готово' } };
        },
      },
      tabs: { create: () => {} },
      storage: { onChanged: { addListener: () => {} } },
    };
  </script>
  <script type="module" src="../popup/popup.js"></script>
</body>
</html>
